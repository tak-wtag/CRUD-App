apiVersion: apps/v1
kind: Deployment
metadata:
  name: crud-deployment
  namespace: crud
spec: 
  replicas: 2
  selector:
    matchLabels:
      component: app
  template:
    metadata:
      labels:
        component: app
    spec:
      containers:
        - name: crud-app
          image: joty46/crud-app:v2
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: 
                name: crud-configmap
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credential
                  key: postgres_user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credential
                  key: postgres_password